name: Release

# Builds the jar with Maven and publishes it as a GitHub release named after the
# version in pom.xml. Runs when a tag like v1.0.0 is pushed, or when started by
# hand from the Actions tab (it then tags the commit it ran on).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom version $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: mvn -B -ntp package

      - name: Smoke test
        run: |
          java -jar target/cpi-extract.jar --version
          java -jar target/cpi-extract.jar --help > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="cpi-extract-$VERSION.jar"
          cp target/cpi-extract.jar "$JAR"
          sha256sum "$JAR" > "$JAR.sha256"
          gh release create "v$VERSION" "$JAR" "$JAR.sha256" \
            --target "$GITHUB_SHA" \
            --title "cpi-extract $VERSION" \
            --notes "Runnable jar (Java 17+): \`java -jar $JAR -c config.properties\`. See the README for options."
