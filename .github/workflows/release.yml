name: Release

# Pushing a tag like v1.0.0 builds the jar with Maven and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches pom version
        run: |
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v$POM_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom version $POM_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: mvn -B -ntp package

      - name: Smoke test
        run: |
          java -jar target/cpi-extract.jar --version
          java -jar target/cpi-extract.jar --help > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="cpi-extract-${GITHUB_REF_NAME#v}.jar"
          cp target/cpi-extract.jar "$JAR"
          sha256sum "$JAR" > "$JAR.sha256"
          gh release create "$GITHUB_REF_NAME" "$JAR" "$JAR.sha256" \
            --title "cpi-extract ${GITHUB_REF_NAME#v}" \
            --notes "Runnable jar (Java 17+): \`java -jar $JAR -c config.properties\`. See the README for options."
